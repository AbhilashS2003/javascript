<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function debounce(f, ms) {
            let timeout;
            return function() {
                clearTimeout(timeout);
                timeout = setTimeout(() => f.apply(this, arguments), ms);
            };
        }

        let f = debounce(alert, 1000);

        f("a");
        setTimeout( () => f("b"), 200);
        setTimeout( () => f("c"), 500);
    </script>
</body>
</html>
