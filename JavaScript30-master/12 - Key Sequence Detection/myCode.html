<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Key Detection</title>
    <script type="text/javascript" src="./cornify.js"></script>
    <link rel="icon" href="https://fav.farm/🔥" />
  </head>
  <body>
    <script>
        const pressed = [];
        const secretcode = 'abhi';

        window.addEventListener('keyup', (e) =>{
            console.log(e.key);
            pressed.push(e.key);
            pressed.splice(-secretcode.length, pressed.length-secretcode.length);
            
            if(pressed.join('').includes(secretcode)){
                console.log("horray");
                cornify_add();
            }
        });
    </script>
  </body>
</html>
