<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Whack A Mole!</title>
  <link href='https://fonts.googleapis.com/css?family=Amatic+SC:400,700' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
    <div class="buttons">
    <button onclick="initialiseVar(200,1000, 'Beginner')">Beginner</button>
    <button onclick="initialiseVar(100,500, 'Intermediate')">Intermediate</button>
    <button onclick="initialiseVar(50,300, 'Expert')">Expert</button>
  </div>
  <div class="level"></div>
  <button onClick="startGame()" class="startBtn">Start!</button>
  <h1>Whack-a-mole! <span class="score">0</span></h1>
 

  <div class="game">
    <div class="hole hole1">
      <div class="mole"></div>
    </div>
    <div class="hole hole2">
      <div class="mole"></div>
    </div>
    <div class="hole hole3">
      <div class="mole"></div>
    </div>
    <div class="hole hole4">
      <div class="mole"></div>
    </div>
    <div class="hole hole5">
      <div class="mole"></div>
    </div>
    <div class="hole hole6">
      <div class="mole"></div>
    </div>
  </div>

<script>
  const holes = document.querySelectorAll('.hole');
  const scoreBoard = document.querySelector('.score');
  const moles = document.querySelectorAll('.mole');
  let lastHole;
  let timeUp = false;
  let score = 0;
  let min;
  let max;

    function initialiseVar(a, b,lv) {
      min = a;
      max = b;
      document.querySelector('.level').innerHTML = `CHOSEN LEVEL : ${lv}`;
    }

    function randomTime(min, max) {
        return Math.round(Math.random() * (max - min) + min);
    }

    function randomHole(holes) {
      const i = Math.floor(Math.random() * holes.length);
      const hole = holes[i];
      if(hole === lastHole){
          return randomHole(holes);
      }
      lastHole = hole;
      return hole;
    }

    function peep() {
      // let time = randomTime(200, 1000);
      let time = randomTime(min, max);
      const hole = randomHole(holes);
      hole.classList.add('up');
      setTimeout(() => {
        hole.classList.remove('up');
        if(!timeUp) peep();
      }, time);
    }

    function startGame() {
      scoreBoard.textContent = 0;
      timeUp = false;
      score = 0;
      peep();
      setTimeout(() => timeUp = true, 10000);
    }

    function bonk(e) {
      if(!e.isTrusted) return;
      score ++;
      this.classList.remove('up');
      scoreBoard.textContent = score;
    }

    moles.forEach(mole => mole.addEventListener('click', bonk));
    
</script>
</body>
</html>
