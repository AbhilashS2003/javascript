<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let salaries = {
            John: 100,
            Ann: 160,
            Pete: 130
        }

        let sum=0;
        function sumObj(obj) {
            for(let key in obj){
                sum+=obj[key];
            }
            
            return sum;
        }

        alert(sumObj(salaries));
    </script>
</body>
</html>
