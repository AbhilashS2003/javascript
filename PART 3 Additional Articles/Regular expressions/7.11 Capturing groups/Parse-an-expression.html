<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function parse(expr) {
            let regx = /(-?\d+(?:\.\d+)?)\s*([-+*\/])\s*(-?\d+(?:\.\d+)?)/;
            let res = expr.match(regx);
            if(!res) return[];
            res.shift();
            return res;
        }
        alert( parse("-1.23 * 3.45") );
    </script>
</body>
</html>
