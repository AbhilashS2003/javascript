<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let regexp = /(?<=<body.*?>)/;

        let str = `
            <html>
            <body style="height: 200px">
            ...
            </body>
            </html>
        `;

        str = str.replace(regexp, `<h1>Hello</h1>`);
        alert(str);
    </script>
</body>
</html>
